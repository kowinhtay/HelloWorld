<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-bg-start: #000000;
      --color-bg-mid: #001a0d;
      --color-bg-end: #000d07;
      --color-glass-bg: rgba(0, 255, 136, 0.04);
      --color-glass-border: rgba(0, 255, 136, 0.15);
      --color-accent: #00ff88;
      --color-accent-hover: #66ffb2;
      --color-accent-glow: rgba(0, 255, 136, 0.4);
      --color-text-primary: #e0fff2;
      --color-text-muted: rgba(224, 255, 242, 0.45);
      --color-input-bg: rgba(0, 255, 136, 0.05);
      --color-input-border: rgba(0, 255, 136, 0.12);
      --color-input-focus: rgba(0, 255, 136, 0.25);
      --color-error: #ff6b6b;
      --radius-card: 20px;
      --radius-input: 10px;
      --radius-button: 10px;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--color-bg-start), var(--color-bg-mid), var(--color-bg-end));
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--color-text-primary);
    }

    /* Ambient orbs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
    }

    body::before {
      width: 400px;
      height: 400px;
      background: #00ff88;
      top: -100px;
      left: -100px;
    }

    body::after {
      width: 350px;
      height: 350px;
      background: #00cc66;
      bottom: -80px;
      right: -80px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 48px 40px;
      background: var(--color-glass-bg);
      border: 1px solid var(--color-glass-border);
      border-radius: var(--radius-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.04) inset;
      position: relative;
      z-index: 1;
    }

    .card-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .card-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--color-accent), #00994d);
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px var(--color-accent-glow);
    }

    .card-icon svg {
      width: 26px;
      height: 26px;
      fill: #001a0d;
    }

    .card-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 0.875rem;
      color: var(--color-text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      display: flex;
      align-items: center;
      pointer-events: none;
      color: var(--color-text-muted);
    }

    .input-icon svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
    }

    .form-input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: var(--color-input-bg);
      border: 1px solid var(--color-input-border);
      border-radius: var(--radius-input);
      color: var(--color-text-primary);
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }

    .form-input::placeholder {
      color: var(--color-text-muted);
    }

    .form-input:focus {
      border-color: var(--color-accent);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 0 3px var(--color-input-focus);
    }

    .form-input.is-error {
      border-color: var(--color-error);
      box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.3);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--color-text-primary);
    }

    .toggle-password svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      pointer-events: none;
    }

    .field-error {
      display: none;
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--color-error);
    }

    .field-error.visible {
      display: block;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--color-text-muted);
      cursor: pointer;
      user-select: none;
    }

    .remember-label input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid var(--color-input-border);
      border-radius: 4px;
      background: var(--color-input-bg);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    .remember-label input[type="checkbox"]:checked {
      background: var(--color-accent);
      border-color: var(--color-accent);
    }

    .remember-label input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .forgot-link {
      font-size: 0.85rem;
      color: var(--color-accent-hover);
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #fff;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--color-accent), #00994d);
      border: none;
      border-radius: var(--radius-button);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px var(--color-accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-login:hover:not(:disabled) {
      opacity: 0.9;
      box-shadow: 0 6px 28px var(--color-accent-glow);
    }

    .btn-login:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .btn-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    .btn-login.loading .btn-label { display: none; }
    .btn-login.loading .btn-spinner { display: block; }
    .btn-login.loading .btn-loading-label { display: inline; }
    .btn-loading-label { display: none; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: var(--color-text-muted);
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-glass-border);
    }

    .signup-prompt {
      text-align: center;
      font-size: 0.875rem;
      color: var(--color-text-muted);
    }

    .signup-prompt a {
      color: var(--color-accent-hover);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .signup-prompt a:hover {
      color: #fff;
    }

    .alert {
      display: none;
      padding: 12px 16px;
      border-radius: var(--radius-input);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .alert.error {
      background: rgba(255, 107, 107, 0.12);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ff9e9e;
    }

    .alert.visible {
      display: block;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
      <h1 class="card-title">Welcome Back</h1>
      <p class="card-subtitle">Sign in to continue to your account</p>
    </div>

    <div class="alert error" id="globalError" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <polyline points="2,4 12,13 22,4"/>
            </svg>
          </span>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>
        <p class="field-error" id="emailError"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
            <svg id="eyeIcon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <p class="field-error" id="passwordError"></p>
      </div>

      <div class="form-options">
        <label class="remember-label">
          <input type="checkbox" id="remember" name="remember" />
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">
        <span class="btn-label">Sign In</span>
        <span class="btn-loading-label">Signing in…</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>
    </form>

    <div class="divider">or</div>

    <p class="signup-prompt">
      Don't have an account? <a href="#">Create one</a>
    </p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const submitBtn = document.getElementById('submitBtn');
    const globalError = document.getElementById('globalError');
    const togglePassword = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    const EYE_OPEN = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const EYE_CLOSED = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.innerHTML = isPassword ? EYE_CLOSED : EYE_OPEN;
      togglePassword.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });

    function clearFieldError(input, errorEl) {
      input.classList.remove('is-error');
      errorEl.textContent = '';
      errorEl.classList.remove('visible');
    }

    function showFieldError(input, errorEl, message) {
      input.classList.add('is-error');
      errorEl.textContent = message;
      errorEl.classList.add('visible');
    }

    function validateEmail(value) {
      if (!value.trim()) return 'Email is required.';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return 'Enter a valid email address.';
      return null;
    }

    function validatePassword(value) {
      if (!value) return 'Password is required.';
      if (value.length < 6) return 'Password must be at least 6 characters.';
      return null;
    }

    emailInput.addEventListener('input', () => clearFieldError(emailInput, emailError));
    passwordInput.addEventListener('input', () => clearFieldError(passwordInput, passwordError));

    function setLoading(isLoading) {
      submitBtn.classList.toggle('loading', isLoading);
      submitBtn.disabled = isLoading;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      globalError.textContent = '';
      globalError.classList.remove('visible');

      const emailVal = emailInput.value;
      const passwordVal = passwordInput.value;

      const emailErr = validateEmail(emailVal);
      const passwordErr = validatePassword(passwordVal);

      if (emailErr) showFieldError(emailInput, emailError, emailErr);
      if (passwordErr) showFieldError(passwordInput, passwordError, passwordErr);
      if (emailErr || passwordErr) return;

      setLoading(true);

      try {
        // Replace this block with your real API call.
        await new Promise((resolve) => setTimeout(resolve, 1800));

        // Simulated invalid credentials response from server:
        const serverMessage = 'Invalid email or password.';
        globalError.textContent = serverMessage;
        globalError.classList.add('visible');
      } catch {
        globalError.textContent = 'Something went wrong. Please try again.';
        globalError.classList.add('visible');
      } finally {
        setLoading(false);
      }
    });
  </script>

</body>
</html>
